# keymap-drawer source for docs/macbook.svg; regenerate with `npm run docs`.
# Highlighted keys are remapped by baseLayer.ts; the small top legend is the printed key.
layout:
  qmk_info_json: docs/macbook-layout.json
draw_config:
  dark_mode: auto
  key_w: 64
  key_h: 60
  shrink_wide_legends: 7
  append_colon_to_layer_header: false
  svg_extra_style: |
    svg.keymap { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    rect.remap { fill: #dbeafe; stroke: #3b82f6; }
    @media (prefers-color-scheme: dark) {
      rect.remap { fill: #1e3a5f; stroke: #60a5fa; }
    }
layers:
  MacBook keyboard:
    - { s: caps lock, t: Shift, type: remap }
    - A
    - S
    - D
    - F
    - G
    - H
    - J
    - K
    - L
    - ;
    - { s: quote, t: Shift, type: remap }
    - return
    - shift
    - Z
    - X
    - C
    - V
    - B
    - N
    - M
    - ","
    - .
    - { s: slash, t: ⌫, type: remap }
    - shift
    - fn
    - { s: control, t: Option, type: remap }
    - { s: option, t: Esc, h: Super, type: remap }
    - { s: command, t: Space, h: Shift, type: remap }
    - { s: space, t: Return, h: Cmd, type: remap }
    - { s: command, t: Tab, h: Symbols, type: remap }
    - { s: option, t: F16, h: Ctrl, type: remap }
    - ←
    - ↑
    - ↓
    - →
